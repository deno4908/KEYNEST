name: Test and deploy KEYNEST
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keynest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_MODE: demo
      KAFKA_ENABLED: 'false'
      REDIS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
      - run: npm run build
        env:
          VITE_DISCORD_URL: ${{ vars.VITE_DISCORD_URL }}
          VITE_FACEBOOK_URL: ${{ vars.VITE_FACEBOOK_URL }}
      - name: Validate deployment script
        run: bash -n deploy/release.sh
      - name: Package runtime (no credentials or node_modules)
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/release.txt
          tar -czf release.tar.gz dist server shared package.json package-lock.json deploy/release.sh
          sha256sum release.tar.gz > release.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: keynest-release
          path: |
            release.tar.gz
            release.sha256
          retention-days: 3

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: keynest-release
      - name: Upload and activate release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          VPS_PORT="${VPS_PORT:-22}"
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="${VPS_USER}@${VPS_HOST}"
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${ssh_opts[@]}" -p "$VPS_PORT" "$target" "mkdir -p /opt/keynest/incoming/$release_id"
          scp "${ssh_opts[@]}" -P "$VPS_PORT" release.tar.gz release.sha256 "$target:/opt/keynest/incoming/$release_id/"
          ssh "${ssh_opts[@]}" -p "$VPS_PORT" "$target" "cd /opt/keynest/incoming/$release_id && sha256sum -c release.sha256 && tar -xzf release.tar.gz deploy/release.sh && bash deploy/release.sh $release_id"
